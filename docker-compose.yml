name: portfolio-service

version: '3.9'
services:
  portfolio-service:
    container_name: portfolio-service
    image: ${DOCKER_REPOSITORY}:${APP_VERSION:-latest}
    hostname: portfolio.service
    ports:
      - ${PORT:-8006:8080}
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-deploy}
      - LOGGING_LEVEL=${LOGGING_LEVEL:-INFO}
      - LOGBACK_FILE=${LOGBACK_FILE:-classpath:logback-spring.xml}
      - SHOW_UTILS_EXCEPTION_STACKTRACE=${SHOW_UTILS_EXCEPTION_STACKTRACE:-false}
      - GCLOUD_PROJECT=${GCLOUD_PROJECT}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - CACHE_ENABLE=${CACHE_ENABLE}
      - REDIS_CACHE_ENABLE=${REDIS_CACHE_ENABLE}
      - REDIS_CACHE_PASSWORD=${REDIS_CACHE_PASSWORD}
      - REDIS_CACHE_PORT=${REDIS_CACHE_PORT}
      - REDIS_CACHE_USERNAME=${REDIS_CACHE_USERNAME}
      - REDIS_CACHE_HOST=${REDIS_CACHE_HOST}
      - APP_ENV=${APP_ENV:-Production}
      - STRAPI_BASE_URL=${STRAPI_BASE_URL}
      - STRAPI_AUTH_TOKEN=${STRAPI_AUTH_TOKEN}

    labels:
      # 1. Attiva il monitoraggio di WUD
      - "wud.watch=true"
      # 2. Monitora specificamente il tag latest
      - "wud.tag.include=^latest$"
      # 3. Controlla le variazioni di hash digest SHA-256
      - "wud.watch.digest=true"
      # 4. Attiva il trigger di deploy automatico
      - "wud.trigger.docker.local.enabled=true"
      # 5. Forza l'esecuzione automatica immediata al rilevamento
      - "wud.trigger.docker.local.auto=true"
      - "wud.trigger.docker.local.threshold=all"

    volumes:
      # Monta il volume "microservice" nella cartella /secrets (in sola lettura)
      - microservice:/secrets:ro
    networks:
      docker-network:
        aliases:
          - portfolio.service

networks:
  docker-network:
    external: true

volumes:
  microservice:
    external: true